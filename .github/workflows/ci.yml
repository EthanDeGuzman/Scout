name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: scout
          POSTGRES_PASSWORD: ${{ secrets.CI_DB_PASSWORD }}
          POSTGRES_DB: scout_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U scout -d scout_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    # Throwaway values for the CI database and tests only. Not real secrets.
    env:
      NODE_ENV: test
      PORT: 3000
      DATABASE_URL: postgres://scout:${{ secrets.CI_DB_PASSWORD }}@localhost:5432/scout_test
      SESSION_SECRET: ${{ secrets.CI_SESSION_SECRET }}
      TOKEN_ENCRYPTION_KEY: ${{ secrets.CI_TOKEN_ENCRYPTION_KEY }}
      AUTH_MODE: demo
      OLLAMA_BASE_URL: http://localhost:11434
      OLLAMA_MODEL: test-model
      OLLAMA_TIMEOUT_MS: 60000
      CLASSIFICATION_REVIEW_THRESHOLD: 0.7
      MS_AUTHORITY: https://login.microsoftonline.com/consumers
      MS_REDIRECT_URI: http://localhost:3000/api/v1/auth/microsoft/callback
      FRONTEND_URL: http://localhost:5173
      SYNC_LOOKBACK_DAYS: 30
      SYNC_INTERVAL_MINUTES: 0

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run lint:check
      - run: npm run build
      - run: npm test
      - run: npm run test:e2e

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
